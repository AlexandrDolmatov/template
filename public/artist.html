<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Исполнитель — Last.fm Clone</title>
  <link rel="stylesheet" href="artist.css" />
</head>
<body>
  <div class="artist-page">
    <div class="artist-header" id="artist-header">
      <button class="back-button" onclick="window.history.back()">&larr;</button>
      <div class="artist-cover" id="artist-cover"></div>
      <div class="artist-info" id="artist-info">
        <!-- Имя, слушатели, жанры (заполняется JS) -->
      </div>
    </div>
    <div class="artist-tabs" id="artist-tabs">
      <button class="tab active" data-tab="tracks">Треки</button>
      <button class="tab" data-tab="similar">Похожие</button>
      <button class="tab" data-tab="bio">Биография</button>
    </div>
    <div class="artist-content" id="artist-content">
      <!-- Контент вкладок -->
    </div>
  </div>
  <!-- Модальное окно для трека -->
  <div id="track-modal" class="modal">
    <div class="modal-content">
      <span class="close-modal">&times;</span>
      <div id="modal-track-content"></div>
    </div>
  </div>
  <script src="artist.js"></script>
</body>
</html>
