<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Last.fm Clone</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Главный контейнер -->
  <div class="container">
    <!-- Шапка -->
    <header>
      <h1>Music</h1>
    </header>

    <!-- Блок "Hot right now" -->
    <section>
      <h2>Hot right now</h2>
      <div class="artists">
        <!-- Исполнители -->
        <div class="artist">
          <strong>Kanye West</strong>
          <span>hip-hop - rap - hip hop</span>
        </div>
        <div class="artist">
          <strong>Jopp</strong>
          <span>k-pop - hip-hop - korean</span>
        </div>
        <!-- Остальные исполнители -->
      </div>
    </section>

    <!-- Блок "Popular tracks" -->
    <section>
      <h3>Popular tracks</h3>
      <ul class="tracks">
        <!-- Треки -->
        <li>
          <strong>SEXY NUKIM (feat. RM of BTS)</strong>
          <span>Balming Tiger • rap - hip hop - alternative</span>
        </li>
        <li>
          <strong>HOPE</strong>
          <span>j-hope • rock - hip-hop - rap</span>
        </li>
        <!-- Остальные треки -->
      </ul>
    </section>

    <!-- Футер -->
    <footer>
      <div class="footer-section">
        <h4>COMPANY</h4>
        <ul>
          <li>About Last.fm</li>
          <li>Contact Us</li>
        </ul>
      </div>
    </footer>
  </div>
</body>
</html>
